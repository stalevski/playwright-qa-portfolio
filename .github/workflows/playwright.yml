name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly health check: detect rot in external targets and dependencies
    # even when nobody is pushing. Monday 06:00 UTC.
    - cron: '0 6 * * 1'

# Cancel superseded runs on the same ref so rapid pushes don't pile up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow only needs to read repository contents.
permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # Playwright transpiles without typechecking, so a type error would
      # otherwise pass CI green. Keep this in the required lint job.
      - run: npm run typecheck
      # Relative links between the docs and the source tree rot silently on
      # renames; this fails the required job instead.
      - run: npm run docs:check

  test-local:
    name: Local app tests — PetHub Local (required)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright system deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run PetHub Local tests
        run: npm run test:local

      - name: Upload PetHub Local HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-local
          path: playwright-report-local/
          retention-days: 14

      - name: Upload PetHub Local test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-local
          path: test-results-local/
          retention-days: 14

  test-external:
    name: External target tests (informational)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    # External targets (Swagger Petstore, Sauce Demo) are public demo sites
    # we do not control. Their flakiness should not block PRs or main.
    # The job still runs and uploads artifacts so we can investigate rot.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright system deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run external target tests
        run: npm run test:external

      - name: Upload external HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload external test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

  auto-merge:
    name: Auto-merge Dependabot minor & patch
    # Gate on the required local suite (which itself needs lint + format:check).
    # The informational external job is intentionally excluded so demo-site
    # flakiness never blocks a merge.
    needs: test-local
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Squash-merge minor, patch & GitHub Actions updates
        # GitHub Actions bumps are validated by this same CI run, so they are
        # safe to auto-merge even on a major; npm majors stay manual.
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.package-ecosystem == 'github_actions'
        run: |
          gh pr merge --squash "$PR_URL" \
            || echo "::notice::Merge deferred; Dependabot will rebase and retry."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publishes the last main-branch Playwright HTML reports to GitHub Pages so
  # the suite can be inspected without downloading artifacts:
  #   https://stalevski.github.io/playwright-qa-portfolio/
  # Pages is configured with `build_type: workflow` (Settings > Pages >
  # Source = GitHub Actions). Only main pushes deploy, so a pull request can
  # never overwrite the published reports.
  publish-report:
    name: Publish HTML reports to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test-local, test-external]
    if: ${{ always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    # Serialise deploys so the newest push wins, without cancelling a
    # half-finished upload.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the reports
        uses: actions/download-artifact@v7
        with:
          path: site

      - name: Generate the index page
        run: |
          cd site
          cat > index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Playwright QA Portfolio - reports</title>
              <style>
                body { font: 16px/1.6 system-ui, sans-serif; margin: 3rem auto; max-width: 40rem; padding: 0 1.5rem; color: #1c2b21; background: #fbf8f2; }
                h1 { font-size: 1.5rem; } a { color: #1c6b3c; }
                li { margin: .5rem 0; } .meta { color: #5b6b60; font-size: .9rem; }
              </style>
            </head>
            <body>
              <h1>Playwright QA Portfolio - HTML reports</h1>
              <p class="meta">Published from the latest <code>main</code> build. Trace and screenshot data are included in each report.</p>
              <ul>
                <li><a href="playwright-report-local/">PetHub Local (required suite)</a> - deterministic in-repo app, Chromium + Firefox + WebKit + a11y</li>
                <li><a href="playwright-report/">External targets (informational)</a> - Swagger Petstore + Sauce Demo</li>
              </ul>
              <p class="meta"><a href="https://github.com/stalevski/playwright-qa-portfolio">Source</a></p>
            </body>
          </html>
          HTML

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
